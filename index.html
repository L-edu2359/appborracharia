<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2328">
  <title>Borracharia Já</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Mapa fica sempre montado (Leaflet não gosta de ser recriado) -->
    <section id="map-screen" class="screen hidden" aria-label="Mapa principal">
      <div id="map"></div>
      <div class="map-top">
        <button class="search-bar" id="open-filters" type="button">
          <span class="ico">🔍</span>
          <span id="search-summary">Buscar borracharia, serviço…</span>
        </button>
        <button class="icon-btn" id="toggle-list" type="button" title="Ver lista" aria-label="Ver lista">☰</button>
      </div>
      <div class="legend" aria-label="Legenda">
        <span><i class="dot open"></i>Aberta</span>
        <span><i class="dot closed"></i>Fechada</span>
        <span><i class="dot unsure"></i>Incerta</span>
      </div>
      <button class="locate-btn" id="locate" type="button" title="Minha localização" aria-label="Minha localização">◎</button>
      <div id="list-panel" class="list-panel hidden"></div>
    </section>

    <section id="screen" class="screen"></section>

    <nav id="nav" class="bottom-nav hidden"></nav>
  </div>

  <div id="sheet-backdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
